# Fails a pull request, or a push to main, that leaves core/ different from hpcenv-core at
# core/CORE_COMMIT.
# Copied from core/sync/workflows/ into .github/workflows/ once; the copy is the
# consumer's own. Also runs when started by hand or by core-sync.yml.
name: core-drift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: core/sync/sync-core.sh --check
